  <style>
    /* LANGUAGE SELECTOR */

    .language-container {
      position: relative;
      z-index: 1000;
    }

    .language-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--border, #333);
      border-radius: 10px;
      background: var(--card, #171717);
      color: var(--text, #fff);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: .25s;
    }

    .language-btn:hover {
      border-color: #ed762b;
      color: #ed762b;
    }

    .language-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 215px;
      max-height: 350px;
      overflow-y: auto;
      padding: 7px;
      border: 1px solid var(--border, #333);
      border-radius: 12px;
      background: var(--card, #171717);
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
      z-index: 3000;
    }

    .language-dropdown.active {
      display: block;
      animation: languageShow .2s ease;
    }

    @keyframes languageShow {
      from {
        opacity: 0;
        transform: translateY(-7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .language-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text, #fff);
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      transition: .2s;
    }

    .language-option:hover,
    .language-option.selected {
      background: rgba(237,118,43,.14);
      color: #ed762b;
    }

    .language-option .flag {
      font-size: 18px;
    }

    .dashboard-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    [dir="rtl"] {
      text-align: right;
    }

    [dir="rtl"] .language-dropdown {
      right: auto;
      left: 0;
    }

    [dir="rtl"] .language-option {
      text-align: right;
    }

    @media(max-width:600px) {
      .language-btn {
        padding: 9px 11px;
      }
    }
  </style>

/* CHANGE LANGUAGE */

function changeLanguage(lang) {

  const selected = xeonDashboardTranslations[lang];

  if (!selected) return;

  // Save selected language

  localStorage.setItem('xeon_language', lang);

  // HTML language

  document.documentElement.lang = lang;

  // RTL support

  document.documentElement.dir =
    ['he', 'ar'].includes(lang) ? 'rtl' : 'ltr';

  // Translate elements

  document.querySelectorAll('[data-i18n]').forEach(element => {

    const key = element.dataset.i18n;

    if (selected[key] !== undefined) {
      element.textContent = selected[key];
    }

  });

  // Update language selector

  document.getElementById('currentFlag').textContent = selected.flag;

  document.getElementById('currentLanguage').textContent = selected.name;

  // Mark selected option

  document.querySelectorAll('.language-option').forEach(button => {

    button.classList.toggle(
      'selected',
      button.dataset.lang === lang
    );

  });

  // Close menu

  document.getElementById('languageDropdown')
    .classList.remove('active');

}


/* LANGUAGE MENU */

function toggleLanguageMenu() {

  document.getElementById('languageDropdown')
    .classList.toggle('active');

}


/* CLOSE MENU OUTSIDE */

document.addEventListener('click', function(event) {

  const container = document.querySelector('.language-container');

  if (container && !container.contains(event.target)) {

    document.getElementById('languageDropdown')
      .classList.remove('active');

  }

});


/* RESTORE SAVED LANGUAGE */

document.addEventListener('DOMContentLoaded', function() {

  const savedLanguage =
    localStorage.getItem('xeon_language') || 'en';

  changeLanguage(
    xeonDashboardTranslations[savedLanguage]
      ? savedLanguage
      : 'en'
  );

});
